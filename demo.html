<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Glare Layer Demo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, Arial, sans-serif; color: #152033; }
  body { display: flex; flex-direction: column; }
  #map { flex: 1; min-height: 300px; }
  .bar { padding: 10px 16px 14px; background: #fff; border-top: 1px solid #d3dae4; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #clock { font-size: 28px; font-weight: 600; }
  #note { font-size: 14px; color: #566378; }
  input[type=range] { width: 100%; height: 36px; accent-color: #0a4fb3; }
  .trip { display: grid; grid-template-columns: 1fr 1fr auto auto; gap: 8px; margin-bottom: 10px; }
  .trip input { font: inherit; padding: 10px; border-radius: 10px; border: 1px solid #d3dae4; min-width: 0; }
  @media (max-width: 560px) { .trip { grid-template-columns: 1fr 1fr; } }
  button { font: inherit; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid #d3dae4; background: #f2f5f9; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <form id="trip" class="trip">
    <input type="text" id="from" placeholder="From: 100 N Kirkwood Rd, Kirkwood MO" aria-label="From">
    <input type="text" id="to" placeholder="To: 1 N Grand Blvd, St. Louis MO" aria-label="To">
    <button type="submit">Directions</button>
    <button type="button" id="clear">Clear</button>
  </form>
  <div class="top">
    <div id="clock">Now</div>
    <button id="now" type="button">Now</button>
  </div>
  <input type="range" id="time" min="0" max="1435" step="5" aria-label="Time of day">
  <div id="note">Tick or untick "Sun glare" in the layer box at the top right. Red roads have the sun in drivers' eyes.</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="glare-layer.js"></script>
<script>
  // A normal Leaflet map, as any site would already have.
  var map = L.map('map').setView([38.5834, -90.4068], 14); // Kirkwood, Missouri
  var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // The plugin: two lines.
  var glare = SunGlare.leaflet(L, { onRoute: function (s) { note(s.glareMinutes < 0.5 ? 'No sun in your eyes on this ' + Math.round(s.minutes) + ' min trip.' : Math.round(s.glareMinutes) + ' of ' + Math.round(s.minutes) + ' min with the sun in your eyes. Red and orange show where.'); }, onError: function (e) { note('Could not load roads: ' + e.message + '. Try again in a minute.'); } }).addTo(map);
  L.control.layers({ 'Streets': streets }, { 'Sun glare': glare }, { collapsed: false }).addTo(map);

  // Optional: a time slider. Leave it out and the layer follows the clock.
  var slider = document.getElementById('time'), clock = document.getElementById('clock');
  function note(t) { document.getElementById('note').textContent = t; }
  function label(m) { var h = Math.floor(m / 60), mm = m % 60, ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12; return h + ':' + (mm < 10 ? '0' : '') + mm + ' ' + ap; }
  function setNow() { var d = new Date(); slider.value = Math.round((d.getHours() * 60 + d.getMinutes()) / 5) * 5; clock.textContent = 'Now, ' + label(+slider.value); glare.setTime(null); }
  slider.addEventListener('input', function () {
    var d = new Date(); d.setHours(0, +slider.value, 0, 0);
    clock.textContent = label(+slider.value); glare.setTime(d);
  });
  document.getElementById('now').addEventListener('click', setNow);

  // Directions the user types. Any directions service works: hand its route to glare.setRoute().
  // Here: OpenStreetMap address search, then the public OSRM demo router.
  var routeLine = null;
  function find(q) {
    return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q))
      .then(function (r) { return r.json(); }).then(function (j) { if (!j.length) throw new Error('Could not find "' + q + '"'); return [+j[0].lon, +j[0].lat]; });
  }
  document.getElementById('trip').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = document.getElementById('from').value.trim(), t = document.getElementById('to').value.trim();
    if (!f || !t) { note('Type both addresses.'); return; }
    note('Finding your route…');
    var A;
    find(f).then(function (a) { A = a; return new Promise(function (ok) { setTimeout(ok, 1100); }); })
      .then(function () { return find(t); })
      .then(function (B) { return fetch('https://router.project-osrm.org/route/v1/driving/' + A.join(',') + ';' + B.join(',') + '?overview=full&geometries=geojson').then(function (r) { return r.json(); }); })
      .then(function (j) {
        var r = j.routes && j.routes[0]; if (!r) throw new Error('No route found');
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.geoJSON(r.geometry, { style: { color: '#0a4fb3', weight: 4, opacity: 0.5 } }).addTo(map);
        map.fitBounds(routeLine.getBounds(), { padding: [30, 30] });
        glare.setRoute(r.geometry, { duration: r.duration }); // the one line that matters
        glare.bringToFront && glare.bringToFront();
      })
      .catch(function (e) { note(e.message + '. Check the addresses and try again.'); });
  });
  document.getElementById('clear').addEventListener('click', function () {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    glare.clearRoute(); note('Tick or untick "Sun glare" in the layer box at the top right. Red roads have the sun in drivers\' eyes.');
  });
  setNow();
</script>
</body>
</html>
